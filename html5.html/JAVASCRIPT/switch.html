<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //switch statement is used to perform different actions based on different conditions with different cases. It is an alternative to using multiple if...else statements.
        let choice = 3;

        switch(choice) {          
            case 0:
                console.log("Today is Sunday");
                break;
            case 1:
                console.log("Today is Monday");
                break;
            case 2:
                console.log("Today is Tuesday");
                break;
            case 3:
                console.log("Today is Wednesday");
                break;
            case 4:
                console.log("Today is Thursday");
                break;
            case 5:
                console.log("Today is Friday");
                break;
            case 6:
                console.log("Today is Saturday");
                break;
            default:
                console.log("Invalid choice");
                break;
        }
    </script>
</body>
</html>
