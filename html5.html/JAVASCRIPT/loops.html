<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //printing numbers from 1 to 10 in console

        //for(starting point; condition; increment/decrement) {
        for(let i = 1; i <= 10; i++) {
            console.log(i);
        }

        //printing numbers from 10 to 1 in console
        for(let i = 10; i >= 1; i--) {
            console.log("the value of i is", i);
        }
    </script>
</body>
</html>
