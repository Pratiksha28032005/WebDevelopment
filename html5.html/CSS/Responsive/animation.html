<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: blueviolet;
            width:100px;
            height:50px;
            margin-bottom: 20px;
            animation-name: square;
            animation-duration:2s;
        }

        @keyframes square{
            from {background-color: blueviolet;}

            to {background-color: cyan;}

    
    }
    </style>
</head>
<body>
    <div></div>
    <strong>Note:Come back to original state after doing the effect</strong>
</body>
</html>
