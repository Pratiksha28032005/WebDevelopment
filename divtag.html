<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Div tag: used for grouping and styling elements together-->
    <!--takes 100% space-->
    <div style="background-color: lightblue; padding: 18px;">
        <h1>Welcome to My Website</h1>
        <p>This is a simple div tag example.</p>
        <ul>
            <li>pizza</li>
            <li>burger</li>
            <li>pasta</li>
        </ul>
    </div>

    <div style="background-color: lightpink;">
        <h2>review</h2>
        <p>this is avery good restaurant</p>
        <h2>⭐⭐⭐⭐⭐</h2>
    </div>
    <!-- span tag: used for styling a specific part of text-->
     <span style="background-color: red;">Login</span>
    <button>🛒 <span>8</span></button>
</body>
</html>
